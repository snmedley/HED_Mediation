# Python checks — runs on every push/PR that touches Python code or requirements.
# Starts as a stub: it verifies requirements install cleanly and runs pytest
# if any tests exist. Extend as the project grows.
name: Python checks

on:
  push:
    paths: ['python/**', 'simulations/**', 'requirements.txt']
  pull_request:
    paths: ['python/**', 'simulations/**', 'requirements.txt']

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if project is R-only
        id: has-py
        run: |
          if [ -d python ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No python/ directory — skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.has-py.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned requirements
        if: steps.has-py.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          if grep -qE '^[a-zA-Z0-9]' requirements.txt; then
            pip install -r requirements.txt
          else
            echo "requirements.txt has no pins yet — nothing to install."
          fi

      - name: Run pytest (if tests exist)
        if: steps.has-py.outputs.run == 'true'
        run: |
          pip install pytest
          # pytest exit code 5 means "no tests collected" — fine for a fresh project
          pytest python/ || [ $? -eq 5 ]
