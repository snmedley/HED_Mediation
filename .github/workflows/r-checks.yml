# R checks — runs on every push/PR that touches R code or the lockfile.
# Starts as a stub: it verifies the renv environment restores cleanly and
# runs testthat tests if any exist. Extend as the project grows.
name: R checks

on:
  push:
    paths: ['R/**', 'simulations/**', 'renv.lock']
  pull_request:
    paths: ['R/**', 'simulations/**', 'renv.lock']

jobs:
  r-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if project is Python-only
        id: has-r
        run: |
          if [ -d R ] && [ -s renv.lock ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No R/ directory or empty renv.lock — skipping."
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.has-r.outputs.run == 'true'
        with:
          use-public-rspm: true

      - name: Restore renv environment
        if: steps.has-r.outputs.run == 'true'
        uses: r-lib/actions/setup-renv@v2

      - name: Run tests (if tests/testthat exists)
        if: steps.has-r.outputs.run == 'true'
        run: |
          if [ -d tests/testthat ]; then
            Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
          else
            echo "No tests yet — renv restore succeeded, which is the check."
          fi
